name: Snyk SAST with SARIF upload
on:
  # push:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  Snyk-SAST-Scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - name: install snyk
        run: npm install -g snyk
      - name: Configure environment
        run: |
          snyk config environment SNYK-GOV-01
          snyk config set org="${{ secrets.SNYK_ORG_ID }}"

      - name: Authenticate with Snyk SaaS
        run: snyk auth --client-id="${{ secrets.SNYK_CLIENT_ID }}" --client-secret="${{ secrets.SNYK_CLIENT_SECRET }}"
      - name: Run SAST
        run: snyk code test --sarif-file-output=snyk_sast.sarif
      - name: Upload SARIF file to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk_sast.sarif


