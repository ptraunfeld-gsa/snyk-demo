name: Snyk SAST 
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Snyk-SAST:
    runs-on: ubuntu-latest
    environment: gsa-integration-test-2
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - name: install snyk
        run: npm install -g snyk
      - name: Snyk CLI Version
        run: snyk --version
      - name: Configure Snyk Gov environment
        run: |
          snyk config environment SNYK-GOV-01
          snyk config set org="${{ secrets.SNYK_ORG_ID }}"
      - name: Authenticate with Snyk Gov SaaS
        run: snyk auth --client-id="${{ secrets.SNYK_CLIENT_ID }}" --client-secret="${{ secrets.SNYK_CLIENT_SECRET }}"
      - name: SCA
        if: always()
        run: snyk test --all-projects --severity-threshold=high
      - name: SAST 
        if: always()
        run: snyk code test --severity-threshold=high

